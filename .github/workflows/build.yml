name: Build Glass TV
on:
  workflow_dispatch:
    inputs:
      prayer:
        description: Sertakan waktu solat
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Patch MainActivity
        run: |
          D=launcher/app/src/main/java/com/gathin/tvhome
          F=$D/MainActivity.java
          sed -i '/root = findViewById(R.id.root);/a\        root.addView(new WeatherOverlay(this, reducedMotion), 0, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));' $F
          if [ "${{ inputs.prayer }}" = "true" ]; then
            sed -i '/vpnApp = cfg.vpnApp;/a\        PrayerStrip.attach(this, root, findViewById(R.id.dateBlock), reducedMotion);' $F
          else
            rm -f $D/PrayerStrip.java
          fi
          grep -n -E "WeatherOverlay|PrayerStrip" $F
          ls $D | grep -E "Weather|Prayer"
      - name: Build
        working-directory: launcher
        run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
